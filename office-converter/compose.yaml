services:
  office-converter:
    build: .
    restart: unless-stopped
    environment:
      OFFICE_CONVERTER_SECRET: ${OFFICE_CONVERTER_SECRET}
      MAX_OFFICE_BYTES: ${MAX_OFFICE_BYTES:-104857600}
      MAX_CONCURRENT_CONVERSIONS: ${MAX_CONCURRENT_CONVERSIONS:-2}
      CONVERSION_TIMEOUT_SECONDS: ${CONVERSION_TIMEOUT_SECONDS:-600}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
